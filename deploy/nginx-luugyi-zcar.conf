# LuuGyi Zcar — host nginx vhost
# Does NOT touch telemanager-mm.com or youtubemanager-mm.
#
# Install:
#   DOMAIN=your-domain.com
#   sed "s/YOUR-DOMAIN.com/$DOMAIN/g" deploy/nginx-luugyi-zcar.conf \
#     | tee /etc/nginx/sites-available/luugyi-zcar
#   ln -sf /etc/nginx/sites-available/luugyi-zcar /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d $DOMAIN -d www.$DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    client_max_body_size 100m;

    location /uploads/ {
        alias UPLOADS_ROOT/;
        access_log off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip off;
        open_file_cache max=200 inactive=60m;
        open_file_cache_valid 30m;
        open_file_cache_min_uses 1;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
