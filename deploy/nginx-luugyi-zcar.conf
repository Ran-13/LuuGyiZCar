# LuuGyi Zcar — host nginx vhost
# Does NOT touch telemanager-mm.com or youtubemanager-mm.
#
# Install:
#   DOMAIN=your-domain.com
#   sed "s/YOUR-DOMAIN.com/$DOMAIN/g" deploy/nginx-luugyi-zcar.conf \
#     | tee /etc/nginx/sites-available/luugyi-zcar
#   ln -sf /etc/nginx/sites-available/luugyi-zcar /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d $DOMAIN -d www.$DOMAIN

# ── Proxy cache zone (shared across all LuuGyi sites) ────────────────
# 10m keys = ~80k cached pages; max 500MB on disk; inactive 60min auto-purge
proxy_cache_path /var/cache/nginx/luugyi levels=1:2 keys_zone=luugyi_cache:10m
                 max_size=500m inactive=60m use_temp_path=off;

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    client_max_body_size 100m;

    # ── Gzip for text assets (HTML, CSS, JS) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/x-font-ttf font/opentype;

    # ── Uploaded banner images — max-speed static serving ─────────────
    location /uploads/ {
        alias UPLOADS_ROOT/;
        access_log off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip off;
        open_file_cache max=500 inactive=60m;
        open_file_cache_valid 30m;
        open_file_cache_min_uses 1;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ── Next.js static assets (_next/static) — immutable forever ──────
    # Filenames are content-hashed per build, so these can never go stale;
    # nginx also caches them so repeat misses never reach Node.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";

        proxy_cache luugyi_cache;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;

        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Next.js image optimizer ───────────────────────────────────────
    # Resizing/encoding a thumbnail is CPU-bound. Without a server-side cache
    # every cold browser re-runs that work in Node; caching the encoded result
    # in nginx turns repeat requests into a static file read.
    location /_next/image {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache luugyi_cache;
        # Key must include the query string — it carries url/w/q.
        proxy_cache_key "$scheme$host$uri$is_args$args";
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;

        proxy_hide_header Cache-Control;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
        add_header X-Cache-Status $upstream_cache_status;
        access_log off;
    }

    # ── Admin API — never cache ──────────────────────────────────────
    location /api/admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_cache off;
    }

    # ── App (SSR + API) — with nginx proxy cache ─────────────────────
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;

        # Browsers must revalidate HTML on every view, so a deploy is picked up
        # immediately. "no-cache" (store, but always revalidate) rather than
        # "no-store" (never store): no-store also disables the back/forward
        # cache, which makes browser Back re-download and re-render the whole
        # page. Revalidation returns a cheap 304 when nothing changed.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        add_header Cache-Control "no-cache" always;

        # Nginx proxy cache — server-side only, invisible to browsers
        proxy_cache luugyi_cache;
        proxy_cache_valid 200 60s;
        proxy_cache_valid 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_key "$scheme$host$request_uri";
        add_header X-Cache-Status $upstream_cache_status;
    }
}
