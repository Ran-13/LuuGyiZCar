# LuuGyi Zcar — host nginx vhost
# Does NOT touch telemanager-mm.com or youtubemanager-mm.
#
# Install:
#   DOMAIN=your-domain.com
#   sed "s/YOUR-DOMAIN.com/$DOMAIN/g" deploy/nginx-luugyi-zcar.conf \
#     | tee /etc/nginx/sites-available/luugyi-zcar
#   ln -sf /etc/nginx/sites-available/luugyi-zcar /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d $DOMAIN -d www.$DOMAIN

server {
    listen 80;
    listen [::]:80;
    server_name YOUR-DOMAIN.com www.YOUR-DOMAIN.com;

    client_max_body_size 100m;

    # ── Gzip for text assets (HTML, CSS, JS) ──────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/x-font-ttf font/opentype;

    # ── Uploaded banner images — max-speed static serving ─────────────
    location /uploads/ {
        alias UPLOADS_ROOT/;
        access_log off;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        gzip off;
        open_file_cache max=500 inactive=60m;
        open_file_cache_valid 30m;
        open_file_cache_min_uses 1;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ── Next.js static assets (_next/static) — immutable forever ──────
    location /_next/static/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # ── Next.js image optimizer ───────────────────────────────────────
    location /_next/image {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # ── App (SSR + API) ──────────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
    }
}
